name: Build iOS (.IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    name: Compilar IPA para iPhone (macOS)
    runs-on: macos-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar iOS Runner.app (Release sin firma previa)
        run: flutter build ios --release --no-codesign

      - name: Empaquetar como archivo .IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r MasterControlApp.ipa Payload

      - name: Subir artefacto .IPA instalable
        uses: actions/upload-artifact@v4
        with:
          name: MasterControlApp-iOS-IPA
          path: build/ios/ipa/MasterControlApp.ipa
          retention-days: 30
